name: Codex Review Rerun

on:
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  codex-review-rerun:
    name: codex-review-rerun
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
      (
        startsWith(github.event.comment.body, 'Codex Review:') ||
        (
          contains(github.event.comment.body, 'codex-pull-request-review-summary') &&
          contains(github.event.comment.body, '**Completed**')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted rerun policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Dispatch trusted gate for Codex evidence
        run: node scripts/codex-review-rerun.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
