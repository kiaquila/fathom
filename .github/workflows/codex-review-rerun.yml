name: Codex Review Rerun

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  codex-review-rerun:
    name: codex-review-rerun
    if: |
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]'
      ) ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        (
          startsWith(github.event.comment.body, 'Codex Review:') ||
          startsWith(github.event.comment.body, '<!-- codex-review-receipt:v1 -->') ||
          startsWith(github.event.comment.body, '<!-- codex-pull-request-review-summary -->')
        )
      )
    # Only eligible evidence jobs acquire this group; unrelated comments must
    # not replace a pending evidence update. The request workflow shares it.
    concurrency:
      group: codex-review-rerun-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted rerun policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rerun gate for trusted Codex evidence
        run: |
          if [ ! -f scripts/codex-review-rerun.mjs ]; then
            echo "Codex Review bootstrap is not installed on the default branch yet; the pull-request gate handles this installation PR."
            exit 0
          fi
          node scripts/codex-review-rerun.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
