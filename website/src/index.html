<style>
  :root {
    --bg: #98a9b7;
    --ink: #262c33;
    --muted: rgba(38, 44, 51, 0.62);
    --line: rgba(38, 44, 51, 0.22);
    --pill: rgba(255, 255, 255, 0.28);
    --pill-on: rgba(255, 255, 255, 0.62);
    --gold: #b07f2f;
    /* The lab wordmark's one chromatic device: the cornflower gradient of
       its dot (ks-design client decision, 2026-08-28; it replaced the
       brand-gold amber of 2026-08-19). Indigo into cyan along the 135°
       diagonal — the vector itself lives in the dot's SVG gradient below.
       Brand dot only; the artwork palette and UI states stay on --gold. */
    --brand-dot-a: #818cf8;
    --brand-dot-b: #22d3ee;
    /* pinned-button border and focus ring: graphite, softer than the ink on the day water */
    --stroke: #52565a;
  }
  body[data-mood="dusk"] {
    --bg: #5b7085;
    --ink: #f1ede5;
    --muted: rgba(241, 237, 229, 0.62);
    --line: rgba(241, 237, 229, 0.28);
    --pill: rgba(255, 255, 255, 0.1);
    --pill-on: rgba(255, 255, 255, 0.3);
    --gold: #e6b45c;
    --stroke: #f1ede5;
  }
  body[data-mood="midnight"] {
    --bg: #0c141c;
    --ink: #ece8e0;
    --muted: rgba(236, 232, 224, 0.58);
    --line: rgba(236, 232, 224, 0.24);
    --pill: rgba(255, 255, 255, 0.08);
    --pill-on: rgba(255, 255, 255, 0.24);
    --gold: #e8b95a;
    --stroke: #ece8e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    transition: background 2s ease, color 2s ease;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .chrome {
    position: fixed;
    left: 0;
    right: 0;
    display: flex;
    pointer-events: none;
    z-index: 2;
  }
  .chrome > * { pointer-events: auto; }
  .top {
    top: 0;
    justify-content: space-between;
    align-items: baseline;
    padding: 22px 28px;
  }
  .tag {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 2s ease;
  }
  .tag strong { color: var(--ink); font-weight: 600; transition: color 2s ease; }
  /* The brand dot is decorative, so the wordmark needs a real separator in the
     accessible name — without it the mark is announced as one word. The same
     class hides the mood status region. */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  /* The dot sits nearer the KS than the DESIGN in a strict 1:2 proportion —
     0.15em after the S, 0.30em before the D. The tag's 0.22em letter-spacing
     already pads the left side, so the left margin only trims it back. Size
     and margins are Ember's (ember.ks-design.art); the circle itself is an
     SVG in the markup, so the gradient is painted as a filled path rather
     than a rounded clip. */
  .dot {
    display: inline-block;
    width: 0.42em;
    height: 0.42em;
    margin: 0 0.3em 0 -0.07em;
  }
  .bottom {
    bottom: 0;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 0 20px 18px;
  }
  .controls {
    display: flex;
    gap: 8px;
  }
  .ctl {
    min-width: 64px;
    height: 36px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--pill);
    color: var(--ink);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, color 2s ease, transform 0.15s ease;
    backdrop-filter: blur(4px);
  }
  .ctl:hover { background: var(--pill-on); }
  .ctl:active { transform: scale(0.96); }
  .ctl[aria-pressed="true"] { background: var(--pill-on); border-color: var(--stroke); }
  .ctl:focus-visible { outline: 2px solid var(--stroke); outline-offset: 3px; }
  footer {
    text-align: center;
    padding-top: 2px;
  }
  footer p {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
    transition: color 2s ease;
  }
  footer a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  footer a:hover { border-color: var(--gold); color: var(--gold); }
  footer a:focus-visible { outline: 2px solid var(--stroke); outline-offset: 2px; }
  @media (max-width: 560px) {
    .top { padding: 16px 18px; }
    .tag { font-size: 10px; letter-spacing: 0.16em; }
    .bottom { gap: 12px; padding-bottom: 14px; }
    .ctl { min-width: 0; padding: 0 12px; height: 34px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body, .tag, .tag strong, footer p, .ctl { transition: none; }
  }
</style>

<script>
/* Fathom — study 03. A school of sequined goldfish drifts through painted water.
   The scene keys itself to the visitor's local clock: day 07:00–16:30, dusk
   16:30–20:30 and 05:30–07:00, midnight otherwise, cross-fading on change.
   Everything is drawn procedurally on one canvas; nothing is fetched. */
const K = (function () {
'use strict';
const TAU = Math.PI * 2;
function mulberry32(seed) { let a = (seed * 1000003) >>> 0; return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const pick = (rnd, arr) => arr[(rnd() * arr.length) | 0];
function makeNoise(seed) { const r = mulberry32(seed); const N = 64; const g = new Float32Array(N * N); for (let i = 0; i < g.length; i++) g[i] = r(); const v = (i, j) => g[(i & 63) + (j & 63) * N]; return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy); return lerp(lerp(v(xi, yi), v(xi + 1, yi), sx), lerp(v(xi, yi + 1), v(xi + 1, yi + 1), sx), sy); }; }
function fbm(n, x, y, o) { o = o || 3; let a = 0, amp = 0.5, f = 1, s = 0; for (let i = 0; i < o; i++) { a += n(x * f, y * f) * amp; s += amp; amp *= 0.5; f *= 2; } return a / s; }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function vary(h, k) { const c = hexToRgb(h).map(v => clamp(Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k)), 0, 255)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
